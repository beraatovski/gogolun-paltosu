<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="app-style">
:root{
  --paper:#f3ead9; --paper-2:#eadfc8; --card:#faf4e6; --ink:#241b14; --ink-soft:#5d4c3d;
  --accent:#7a1f2b; --accent-ink:#fff6ea; --gold:#a97f2e; --line:#d5c5a5; --shadow:0 10px 30px -14px rgba(60,35,15,.45);
  --serif:'Playfair Display','Iowan Old Style',Georgia,'Times New Roman',serif;
  --body:'Lora','Iowan Old Style',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16110d; --paper-2:#1e1711; --card:#211a13; --ink:#efe4cf; --ink-soft:#b9a98f;
    --accent:#d0705f; --accent-ink:#1a0f0b; --gold:#d3ad5a; --line:#3b3026; --shadow:0 10px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#16110d; --paper-2:#1e1711; --card:#211a13; --ink:#efe4cf; --ink-soft:#b9a98f;
  --accent:#d0705f; --accent-ink:#1a0f0b; --gold:#d3ad5a; --line:#3b3026; --shadow:0 10px 30px -14px rgba(0,0,0,.8);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
p{margin:0 0 1em}
main{max-width:1080px;margin:0 auto;padding:0 20px 80px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.25rem;color:var(--ink)}
.brand svg{width:30px;height:30px;color:var(--accent)}
nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
nav a,nav button{font:inherit;font-size:.95rem;color:var(--ink-soft);text-decoration:none;padding:6px 12px;border-radius:999px;background:none;border:0;cursor:pointer}
nav a:hover,nav button:hover{color:var(--ink);background:var(--paper-2)}
nav a.on{color:var(--accent);background:var(--paper-2);font-weight:600}

/* hero */
.hero{text-align:center;padding:64px 0 48px;border-bottom:1px solid var(--line)}
.hero .emb{width:84px;height:84px;color:var(--accent);margin:0 auto 14px;display:block}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);margin-bottom:.2em}
.hero .tag{font-size:1.15rem;color:var(--ink-soft);font-style:italic;max-width:560px;margin:0 auto 26px}
.epi{max-width:520px;margin:30px auto 0;font-style:italic;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:20px}
.epi small{display:block;font-style:normal;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 14px;font-size:.85rem}
.btn.danger{border-color:#a3392b;color:#a3392b;background:transparent}
section.blk{padding:44px 0 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sh h2{margin:0;font-size:1.6rem}
.sh a{font-size:.9rem;color:var(--accent)}

/* covers & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 22px}
.card-item{position:relative;animation:fadeIn .35s ease-out}
.card{text-decoration:none;display:block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px)}
.cover{--c:#5b2a2a;position:relative;aspect-ratio:2/3;background:var(--c);color:#f4ead2;border-radius:3px 9px 9px 3px;box-shadow:var(--shadow), inset 5px 0 0 rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:13% 12%;overflow:hidden;transition:box-shadow .25s ease, transform .25s ease}
.card:hover .cover{box-shadow:0 18px 36px -10px rgba(60,35,15,.55), inset 5px 0 0 rgba(0,0,0,.22)}
.cover::before{content:"";position:absolute;inset:6% 6% 6% 9%;border:1px solid rgba(244,234,210,.4);pointer-events:none}
.cover.has-img{padding:0;background:#222}
.cover.has-img::before{display:none}
.cover.has-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.card:hover .cover.has-img img{transform:scale(1.03)}
.imgprev{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.imgprev .cover{width:110px;flex:0 0 auto}
.c-author{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85;z-index:1}
.c-title{font-family:var(--serif);font-size:clamp(.95rem,2.2vw,1.25rem);line-height:1.25;font-weight:700;z-index:1;word-break:break-word}
.c-mark{width:26px;height:26px;opacity:.8;z-index:1}
.c-mark svg{width:100%;height:100%}
.card h3{font-size:1.05rem;margin:14px 0 2px}
.card .by{font-size:.9rem;color:var(--ink-soft);margin:0}
.card .meta{font-size:.78rem;color:var(--ink-soft);opacity:.85;margin:2px 0 0;letter-spacing:.02em}
.draft-tag{display:inline-block;font-size:.7rem;background:var(--gold);color:#1b1206;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-family:var(--body)}

/* fav button & badge */
.fav-btn{position:absolute;top:8px;right:8px;z-index:4;width:32px;height:32px;border-radius:50%;background:rgba(22,17,13,.65);color:#f4ead2;border:1px solid rgba(244,234,210,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s ease, background .15s ease, color .15s ease;backdrop-filter:blur(4px);outline:none}
.fav-btn:hover{transform:scale(1.15);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fav-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fav-btn svg{width:16px;height:16px;pointer-events:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;font-size:.72rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;margin-left:5px;font-weight:600;line-height:1}

/* quote card */
.quote-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:26px 30px;margin:36px auto 10px;max-width:760px;box-shadow:var(--shadow);text-align:center;position:relative}
.quote-card .q-mark{font-family:var(--serif);font-size:3rem;line-height:1;color:var(--gold);opacity:.5;display:block;margin-bottom:-14px}
.quote-text{font-family:var(--serif);font-size:clamp(1.08rem,2.4vw,1.26rem);font-style:italic;color:var(--ink);line-height:1.6;margin:0 0 10px}
.quote-meta{font-size:.88rem;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.quote-author{font-weight:700;color:var(--accent);letter-spacing:.04em}
.quote-src{font-style:italic}
.quote-btn{margin-top:14px;background:none;border:1px dashed var(--line);border-radius:999px;padding:5px 14px;font-size:.82rem;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.quote-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--paper-2)}

/* animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page,.hero,.feature,.quote-card{animation:fadeIn .3s ease-out}
.btn,.chip,nav a,nav button{transition:all .2s ease}
.btn:active,.chip:active{transform:scale(.97)}

.feature{display:grid;grid-template-columns:200px 1fr;gap:34px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;margin-top:44px;box-shadow:var(--shadow)}
.feature .kicker{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.feature h2{font-size:1.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.88rem;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.65;margin-left:4px}

/* pages */
.page{padding-top:44px}
.ptitle{font-size:clamp(2rem,5vw,3rem)}
.lead{color:var(--ink-soft);font-size:1.05rem;max-width:640px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 16px}
input[type=text],input[type=search],input[type=url],input[type=date],input[type=number],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.filters input{flex:1 1 260px;width:auto}
.filters select{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--ink-soft);font-style:italic;padding:24px 0}
#lib-results{margin-top:28px}

/* book detail */
.book{display:grid;grid-template-columns:240px 1fr;gap:44px;padding-top:44px;align-items:start}
.book aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.book h1{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-bottom:.15em}
.publine{font-size:.95rem;color:var(--ink-soft);margin:-8px 0 14px}
.byline{font-size:1.15rem;font-style:italic;color:var(--ink-soft);margin-bottom:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:1px 9px;color:var(--ink-soft);background:var(--card)}
.summary{font-size:1.1rem;border-left:3px solid var(--gold);padding-left:18px;margin:20px 0 26px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:30px 0 22px;align-items:center;flex-wrap:wrap}
.tabs button.tb{font:inherit;font-family:var(--serif);font-size:1.05rem;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--ink-soft);cursor:pointer;margin-bottom:-1px}
.tabs button.tb.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabs .sz{margin-left:auto;display:flex;gap:4px}
.tabs .sz button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;width:34px;height:30px;cursor:pointer}
.reader{font-size:calc(1.05rem * var(--rs,1));line-height:1.85;max-width:680px}
.reader h3{margin-top:1.8em;font-size:1.3em;color:var(--accent)}
.reader p.tp{display:flex;gap:14px}
.reader .ts{flex:0 0 auto;font-size:.78em;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gold);padding-top:.35em;text-decoration:none;min-width:3.6em}
.reader a.ts:hover{text-decoration:underline}
.src{list-style:none;padding:0;margin:0;max-width:680px}
.src li{padding:12px 0;border-bottom:1px dashed var(--line)}
.src a{color:var(--accent);word-break:break-word}
.src small{display:block;color:var(--ink-soft)}
.hide{display:none!important}
.back{display:inline-block;margin-top:34px;color:var(--accent);text-decoration:none}
.dl-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.dl-row .btn{font-size:.88rem;padding:8px 16px}
.dl-tag{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);margin-left:6px;vertical-align:middle;font-family:system-ui,sans-serif;font-weight:600;letter-spacing:0}

/* about */
.about{max-width:680px;font-size:1.08rem}
.about::first-letter{font-family:var(--serif);font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--accent)}

/* footer */
footer{border-top:1px solid var(--line);margin-top:60px;padding:30px 20px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink-soft);font-size:.9rem}
footer svg{width:26px;height:26px;color:var(--accent);display:block;margin:0 auto 8px}

/* admin */
.admin-tabs{display:flex;gap:8px;margin:20px 0 24px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .t{font-family:var(--serif);font-weight:700}
.tbl .mini{width:34px;height:48px;border-radius:2px 4px 4px 2px;background:var(--c)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl .acts .btn{margin-left:4px}
.wrap-x{overflow-x:auto}
.form{display:grid;gap:18px;max-width:760px}
.form label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.form .hint{font-weight:400;color:var(--ink-soft);font-size:.82rem;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
textarea{resize:vertical;min-height:90px;line-height:1.6}
textarea.big{min-height:380px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{margin:0;cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--accent)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 18px;margin:16px 0}
.pill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:.9rem;max-width:calc(100% - 32px)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:50;max-width:90%;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:420px;box-shadow:var(--shadow)}
.dlg .btns{justify-content:flex-end;margin-top:18px}

/* auth & user */
.nav-auth-btn{font:inherit;font-size:.88rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:5px 13px;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .18s ease;font-weight:600}
.nav-auth-btn:hover{background:var(--accent);color:var(--accent-ink)}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-size:.85rem;color:var(--ink);text-decoration:none;transition:all .18s ease}
.user-chip:hover,.user-chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--paper-2))}
.user-name{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.user-logout-btn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:.8rem;padding:2px 6px;border-radius:4px;opacity:.9}
.user-logout-btn:hover{opacity:1;text-decoration:underline}
.auth-dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:390px;width:100%;box-shadow:var(--shadow);position:relative;animation:fadeIn .2s ease-out}
.auth-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.4rem;color:var(--ink-soft);cursor:pointer;padding:4px 8px;line-height:1}
.auth-close:hover{color:var(--ink)}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;gap:8px}
.auth-tab{font:inherit;font-family:var(--serif);font-size:1.15rem;font-weight:600;padding:8px 12px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);cursor:pointer;margin-bottom:-1px;transition:all .18s}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.auth-desc{font-size:.85rem;color:var(--ink-soft);margin-bottom:16px;line-height:1.5}
.auth-input{width:100%;padding:9px 12px;font:inherit;font-size:.92rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:12px;box-sizing:border-box}
.auth-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.auth-btn-submit{width:100%;padding:10px;font-size:.95rem;justify-content:center;margin-top:4px}
.auth-msg{padding:10px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;display:none;line-height:1.5}
.auth-msg.err{display:block!important;background:rgba(180,40,40,.12);border:1px solid rgba(180,40,40,.3);color:#b42828}
.auth-msg.succ{display:block!important;background:rgba(40,140,60,.12);border:1px solid rgba(40,140,60,.3);color:#288c3c}

/* admin members */
.member-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.member-search-wrap{flex:1;min-width:240px}
.member-search-wrap input{width:100%;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:.92rem;box-sizing:border-box}
.member-search-wrap input:focus{outline:none;border-color:var(--accent)}
.member-user-cell{display:flex;align-items:center;gap:10px}
.member-avatar-mini{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#2b1216);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.88rem;font-weight:700;flex-shrink:0}
.member-name{font-weight:600;color:var(--ink);font-size:.93rem}
.member-username{font-size:.8rem;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
.member-email{font-size:.85rem;color:var(--ink-soft);word-break:break-all}
.member-date{font-size:.85rem;color:var(--ink-soft);white-space:nowrap}
.member-favs{font-size:.82rem;color:var(--gold);font-weight:600;white-space:nowrap}
.member-role-chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-block;white-space:nowrap}
.member-role-chip.admin{background:color-mix(in srgb,var(--gold) 25%,transparent);color:color-mix(in srgb,var(--ink) 80%,var(--gold));border:1px solid var(--gold)}
.member-role-chip.member{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.member-status-chip{font-size:.72rem;padding:2px 7px;border-radius:999px;display:inline-block;white-space:nowrap}
.member-status-chip.active{background:rgba(40,140,60,.12);color:#288c3c;border:1px solid rgba(40,140,60,.3)}
.member-status-chip.pending{background:rgba(200,140,20,.12);color:#b87a14;border:1px solid rgba(200,140,20,.3)}
.member-acts{display:flex;gap:6px;justify-content:flex-end}
.sync-tip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:.88rem;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync-tip button{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-weight:600;padding:0}
.auth-row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.auth-forgot-link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:.82rem;padding:0;text-decoration:underline}
.auth-back-link{display:inline-block;margin-top:14px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font:inherit;font-size:.85rem;padding:0}
.auth-back-link:hover{color:var(--accent);text-decoration:underline}

/* profile / account page */
.profile-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);margin-bottom:28px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.profile-avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#300f13);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.9rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);flex-shrink:0;letter-spacing:1px}
.profile-info{flex:1;min-width:220px}
.profile-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.profile-name{font-family:var(--serif);font-size:1.55rem;font-weight:700;color:var(--ink);margin:0}
.profile-role-badge{font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.profile-role-badge.admin{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--ink) 85%,var(--gold));border-color:var(--gold)}
.profile-meta{font-size:.88rem;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.profile-meta span{display:inline-flex;align-items:center;gap:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.stat-box:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat-icon{font-size:1.7rem;margin-bottom:4px;line-height:1}
.stat-val{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--ink);margin-bottom:2px}
.stat-lbl{font-size:.8rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:30px}
.badge-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:all .18s;box-shadow:var(--shadow)}
.badge-card.locked{opacity:.42;filter:grayscale(1)}
.badge-card-icon{font-size:2rem;flex-shrink:0}
.badge-card-title{font-weight:600;font-size:.92rem;color:var(--ink);margin-bottom:2px}
.badge-card-desc{font-size:.78rem;color:var(--ink-soft);line-height:1.3}
.acc-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:24px;box-shadow:var(--shadow)}
.acc-section-title{font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acc-fav-preview{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.acc-fav-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;background:var(--paper-2);border-radius:10px;border:1px solid var(--line)}
.acc-fav-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.acc-fav-title{font-weight:600;font-size:.95rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-fav-meta{font-size:.82rem;color:var(--ink-soft)}

@media (max-width:720px){
  body{font-size:16px}
  main{padding:0 16px 70px}
  .hero{padding:44px 0 36px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 16px}
  .feature{grid-template-columns:1fr;text-align:center;padding:22px}
  .feature .cover{max-width:170px;margin:0 auto}
  .quote-card{padding:20px 16px;margin:28px 0 10px}
  .quote-text{font-size:1.1rem}
  .fav-btn{width:28px;height:28px}
  .fav-btn svg{width:14px;height:14px}
  .book{grid-template-columns:1fr;gap:26px}
  .book aside{position:static;max-width:200px;margin:0 auto}
  .row2,.row3{grid-template-columns:1fr}
  .bar{padding:8px 14px}
  .tabs .sz{margin-left:0}
}
</style>
</head>

<script type="application/json" id="site-data">{"v":1,"site":{"name":"Gogol'un Paltosu","tagline":"Kitaplar, edebiyat ve sanat üzerine konuşmalar, notlar ve kaynaklar.","admin":"gogolunpaltosu","youtube":"https://www.youtube.com/@ngogolunpaltosu","about":"Gogol'un Paltosu, YouTube kanalımda kitaplar, edebiyat ve sanat üzerine ürettiğim içeriklerin yazılı karşılığıdır.\n\nBuradan her videonun konuşma metnine, bahsettiğim kaynaklara ve ek notlara ulaşabilirsiniz. Bir kitabı dinlerken de okurken de yanınızda olsun diye hazırladım.\n\nSitenin adı, Rus edebiyatının ‘küçük adam’ geleneğini başlatan Gogol'un “Palto” öyküsünden geliyor: Dostoyevski'ye atfedilen “Hepimiz Gogol'un Palto'sundan çıktık” sözü, edebiyatın birbirinden nasıl beslendiğini çok iyi anlatıyor.","footer":"Kitaplar üzerine konuşmalar.","instagram":"https://www.instagram.com/ngogolunpaltosu/"},"books":[{"title":"Palto","epub":"https://www.gutenberg.org/ebooks/10835.epub.noimages","pdf":"https://ia800204.us.archive.org/3/items/the_overcoat_10835/the_overcoat_10835.pdf","author":"Nikolay Gogol","publisher":"Can Yayınları","year":"1842","category":"Öykü","date":"2026-09-18","video":"","tags":["rus edebiyatı","klasik","örnek"],"summary":"Yeni bir paltoya kavuşan küçük bir memurun, görünmezlikten görünürlüğe ve sonra yeniden kayboluşa uzanan hikâyesi.","transcript":"## Palto neden bu kadar önemli?\n\n00:00 Bu bir örnek metindir. Kendi konuşma metinlerinizi yönetim panelinden ekleyebilir, bu örnekleri silebilirsiniz.\n\nGogol'un \"Palto\" öyküsü, Petersburg'da küçük bir memur olan Akaki Akakiyeviç'in hayatını anlatır. Gün boyu evrak kopyalayan bu adam, eski paltosu artık yamanamayacak hale gelince yeni bir palto diktirmek için yıllarca biriktirir.\n\n## Paltonun kaybı\n\n02:40 Yeni palto, Akaki için sadece bir giysi değil; görünür olmanın, ciddiye alınmanın bir biçimidir. Bu yüzden ilk gece çalınması, öykünün asıl kırılma noktasıdır.\n\nYardım aradığı \"önemli şahsiyet\" tarafından azarlanan Akaki hastalanır ve ölür. Öykü, hayaletin Petersburg sokaklarında paltoları çalmasıyla tuhaf bir adalet duygusuna bağlanır.\n\n05:10 Rus edebiyatında \"küçük adam\" geleneğinin başlangıcı olarak okunan bu öykü, sonraki kuşakları derinden etkilemiştir.","sources":[{"t":"Nikolay Gogol, Palto","u":"","n":"Örnek kaynak — silip kendi kaynaklarınızı ekleyin"}],"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCALQAc4DASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAAEDBAUCBgcICf/EAGAQAAIBAwIDBQQECQQNBwoFBQECAwAEEQUhBhIxBxNBUWEIInGBFDKRoRUjQlJisbPB0TNydYIWFyQlN0NjkpOisuHwCSc0U3ODwhgmNUVVZZSj0vE2RGS04igpOFR0/8QAHAEBAQEBAAMBAQAAAAAAAAAAAAECAwQFBwYI/8QAJhEBAQEBAAICAgICAgMAAAAAAAERAiExA0EFEgQyBlEUcSJhwf/aAAwDAQACEQMRAD8A9koPcHwFLihPqiloExS0UUBRRRQGKMUY9aKAxRiiigMUYoooDFGKKKAxRiiigKKKKAooo+VAmKMUtFAmKMUtFAmKMUtFAmKMUtFAmKMUtFAmKMUtFAmKWiigDSYpaKAooooCkxS0UAKDRRQJtS4o2ooExRilooDFGKKKAxRiiigMUYoooDFGKKKAxRiiigMUzd7RD+dT1M3n8kP51A6n1aWkX6tLQFc67Y+0S44CudGEdgl3HqJnjPMSOV1VeQluipzMOZj0FdFqt1fQtI1eeCbU7CC7eBJI4+9XICyLyuMeII2oOfcQcc8W6f8AhW0tdNtL24038Hm5nt4ZJVjjnV2mlEanmdV5dlBzg1D4g7ZLPS9f4WsLe70y+tL+GGbULkSd2QkzCONokJyfeySD0UVvMvA3DEljJZHTeSGRIo3CTOrMsQKxgsDnADEfOso+BuEksbmyGgWIt7mJIZU7sboihVX0AA8K function syncFavsWithCloud(cloudList) {
  if (!Array.isArray(cloudList)) cloudList = [];
  var merged = favs.slice();
  cloudList.forEach(function(id) {
    if (merged.indexOf(id) < 0) merged.push(id);
  });
  favs = merged;
  try { localStorage.setItem('gp-favs', JSON.stringify(favs)); } catch(e){}
  if (curUser && supa && merged.length > cloudList.length) {
    supa.auth.updateUser({ data: { reading_list: merged } }).catch(function(){});
  }
}

var ADMIN_IDENTIFIERS = ['gogolunpaltosu'];
if (!Array.isArray(S.members)) S.members = [];
var memberSearchQ = '';

var DEFAULT_ADMIN_MEMBER = {
  id: 'admin-gogolunpaltosu',
  email: 'gogolunpaltosu@gmail.com',
  username: 'gogolunpaltosu',
  full_name: "Gogol'un Paltosu (Yönetici)",
  role: 'admin',
  created_at: '2026-09-18T10:00:00.000Z',
  confirmed: true,
  reading_list: []
};

function getAdminMembersList() {
  if (!Array.isArray(S.members)) S.members = [];
  var localList = [];
  try {
    var raw = localStorage.getItem('gp-members');
    if (raw) localList = JSON.parse(raw);
  } catch(e){}

  var map = {};
  map['gogolunpaltosu'] = Object.assign({}, DEFAULT_ADMIN_MEMBER);

  S.members.forEach(function(m){
    var k = (m.username || m.email || m.id || '').toLowerCase();
    if (k) map[k] = Object.assign({}, m);
  });

  localList.forEach(function(m){
    var k = (m.username || m.email || m.id || '').toLowerCase();
    if (k) {
      if (map[k]) map[k] = Object.assign(map[k], m);
      else map[k] = Object.assign({}, m);
    }
  });

  var list = Object.values(map);
  list.sort(function(a, b){
    if (a.role === 'admin' && b.role !== 'admin') return -1;
    if (b.role === 'admin' && a.role !== 'admin') return 1;
    return String(b.created_at || '').localeCompare(String(a.created_at || ''));
  });
  return list;
}

function addMemberToRegistry(m) {
  if (!m || (!m.email && !m.username)) return;
  if (!Array.isArray(S.members)) S.members = [];

  var key = (m.username || m.email || m.id || '').toLowerCase();
  var idx = S.members.findIndex(function(x){
    return (x.username && x.username.toLowerCase() === key) ||
           (x.email && x.email.toLowerCase() === (m.email||'').toLowerCase()) ||
           (x.id && x.id === m.id);
  });

  if (idx >= 0) {
    S.members[idx] = Object.assign({}, S.members[idx], m);
  } else {
    S.members.unshift(m);
  }

  try {
    localStorage.setItem('gp-members', JSON.stringify(S.members));
  } catch(e){}
  markDirty();
}

async function fetchSupabaseMembers() {
  if (!supa) return false;
  var found = false;
  try {
    var rpcRes = await supa.rpc('get_all_members');
    if (rpcRes && Array.isArray(rpcRes.data) && rpcRes.data.length > 0) {
      rpcRes.data.forEach(function(u){
        var meta = u.raw_user_meta_data || {};
        addMemberToRegistry({
          id: u.id,
          email: u.email,
          username: meta.username || '',
          full_name: meta.full_name || '',
          created_at: u.created_at,
          role: (meta.role === 'admin' || (u.email && u.email.indexOf('gogolunpaltosu') >= 0)) ? 'admin' : 'member',
          reading_list: meta.reading_list || [],
          confirmed: true
        });
      });
      found = true;
    }
  } catch(e){}

  try {
    var tblRes = await supa.from('profiles').select('*');
    if (tblRes && Array.isArray(tblRes.data) && tblRes.data.length > 0) {
      tblRes.data.forEach(function(u){
        addMemberToRegistry(u);
      });
      found = true;
    }
  } catch(e){}

  return found;
}

function updateAdminStatus(){
  if(!curUser){
    canEdit = false;
    return;
  }
  var email = (curUser.email || '').toLowerCase().trim();
  var meta = curUser.user_metadata || {};
  var uname = (meta.username || '').toLowerCase().trim().replace(/^@/,'');
  var siteAdmin = (S.site.admin || 'gogolunpaltosu').toLowerCase().trim().replace(/^@/,'');
  
  if(siteAdmin){
    if(email === siteAdmin || (uname && uname === siteAdmin) || (siteAdmin.length >= 4 && email.indexOf(siteAdmin) >= 0)){
      canEdit = true;
      return;
    }
  }
  
  for(var i=0; i<ADMIN_IDENTIFIERS.length; i++){
    var aid = ADMIN_IDENTIFIERS[i].toLowerCase().trim().replace(/^@/,'');
    if(aid && (email === aid || uname === aid || (aid.length >= 4 && email.indexOf(aid) >= 0))){
      canEdit = true;
      return;
    }
  }
  
  if(meta.role === 'admin'){
    canEdit = true;
    return;
  }

  canEdit = false;
}

function handleUserSession(user) {
  curUser = user;
  updateAdminStatus();
  if (user) {
    var uMeta = user.user_metadata || {};
    var isAdm = canEdit || uMeta.role === 'admin' || (user.email && user.email.indexOf('gogolunpaltosu') >= 0);
    addMemberToRegistry({
      id: user.id,
      email: user.email,
      username: uMeta.username || '',
      full_name: uMeta.full_name || '',
      created_at: user.created_at || new Date().toISOString(),
      role: isAdm ? 'admin' : 'member',
      reading_list: uMeta.reading_list || favs,
      confirmed: true
    });
    if (user.user_metadata) {
      syncFavsWithCloud(user.user_metadata.reading_list);
    }
  }
  render();
}

function openAuthModal(tab) {
  authTab = tab || 'login';
  var ov = document.getElementById('auth-overlay');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.className = 'ov';
  ov.id = 'auth-overlay';
  ov.innerHTML = renderAuthModalContent();
  document.body.appendChild(ov);
  attachAuthModalEvents(ov);
}

function closeAuthModal() {
  var ov = document.getElementById('auth-overlay');
  if (ov) ov.remove();
}

    + '<button class="auth-tab' + (!isLogin ? ' active' : '') + '" data-a="switch-tab" data-tab="signup">Kayıt Ol</button>'
    + '</div>'
    + '<p class="auth-desc">' + (isLogin 
        ? 'Hesabınıza giriş yaparak okuma listenize tüm cihazlarınızdan ulaşabilirsiniz.' 
        : 'Ücretsiz hesap oluşturarak okuma listenizi bulutta saklayın ve cihazlarınız arasında eşitleyin.') + '</p>'
    + '<div id="auth-msg" class="auth-msg"></div>'
    + '<form id="auth-form" onsubmit="return false;">'
    + (!isLogin ? '<div class="row2" style="gap:10px"><div><label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">Ad Soyad</label><input type="text" id="auth-name" class="auth-input" placeholder="Örn: Lev Tolstoy" required></div><div><label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">Kullanıcı Adı</label><input type="text" id="auth-username" class="auth-input" placeholder="tolstoy" required pattern="[a-zA-Z0-9_.-]+" title="Harf, rakam, nokta veya alt çizgi"></div></div>' : '')
    + (isLogin 
        ? '<label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">E-posta veya Kullanıcı Adı</label><input type="text" id="auth-email" class="auth-input" placeholder="adiniz@ornek.com veya @kullaniciadi" required autocorrect="off" autocapitalize="none">'
        : '<label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">E-posta Adresi</label><input type="email" id="auth-email" class="auth-input" placeholder="adiniz@ornek.com" required>')
    + (isLogin 
        ? '<div class="auth-row-between"><label style="font-size:.85rem;font-weight:600;margin:0">Şifre</label><button type="button" class="auth-forgot-link" data-a="switch-tab" data-tab="forgot">Şifremi unuttum</button></div>'
        : '<label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">Şifre</label>')
    + '<input type="password" id="auth-password" class="auth-input" placeholder="En az 6 karakter" required minlength="6">'
    + (!isLogin ? '<label style="display:block;font-size:.85rem;margin-bottom:4px;font-weight:600">Şifre (Tekrar)</label><input type="password" id="auth-password-confirm" class="auth-input" placeholder="Şifrenizi tekrar girin" required minlength="6">' : '')
    + '<button type="submit" id="auth-submit-btn" class="btn auth-btn-submit">' + (isLogin ? 'Giriş Yap' : 'Kayıt Ol') + '</button>'
    + '</form>'

}

function attachAuthModalEvents(ov) {
  ov.addEventListener('click', function(e) {
    if (e.target === ov) closeAuthModal();
    var closeBtn = e.target.closest('[data-a="close-auth"]');
    if (closeBtn) closeAuthModal();
    var tabBtn = e.target.closest('[data-a="switch-tab"]');
    if (tabBtn) {
      authTab = tabBtn.getAttribute('data-tab');
      ov.innerHTML = renderAuthModalContent();
      attachAuthModalEvents(ov);
    }
  });

  var form = ov.querySelector('#auth-form');
  if (form) {
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      var msgEl = ov.querySelector('#auth-msg');
      var submitBtn = ov.querySelector('#auth-submit-btn');

      function setAuthMsg(type, html) {
        if (!msgEl) return;
        msgEl.className = 'auth-msg ' + (type === 'succ' ? 'succ' : 'err');
        msgEl.style.display = 'block';
        msgEl.innerHTML = html;
      }
      function clearAuthMsg() {
        if (!msgEl) return;
        msgEl.className = 'auth-msg';
        msgEl.style.display = 'none';
        msgEl.innerHTML = '';
      }

      if (!supa) {
        setAuthMsg('err', '❌ Supabase bağlantısı kurulamadı. Lütfen internet bağlantınızı kontrol edin.');
        return;
      }

      clearAuthMsg();

      // 1. Şifremi Unuttum
      if (authTab === 'forgot') {
        var email = (ov.querySelector('#auth-email') ? ov.querySelector('#auth-email').value : '').trim();
        if (!email) {
          setAuthMsg('err', '❌ Lütfen e-posta adresinizi girin.');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Gönderiliyor…';
        try {
          var redirectUrl = window.location.href.split('#')[0];
          var res = await supa.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
          if (res.error) throw res.error;
          setAuthMsg('succ', '✅ <b>Şifre sıfırlama bağlantısı gönderildi!</b><br>Lütfen <b>' + esc(email) + '</b> adresinin gelen kutusunu (ve spam klasörünü) kontrol edin.');
          submitBtn.style.display = 'none';
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sıfırlama Bağlantısı Gönder';
          setAuthMsg('err', '❌ ' + (err.message || 'Sıfırlama bağlantısı gönderilemedi.'));
        }
        return;
      }

      // 2. Yeni Şifre Güncelleme (şifre sıfırlama linkine tıklandığında)
      if (authTab === 'newpass') {
        var newPass = ov.querySelector('#auth-password').value;
        var newPassConfirm = ov.querySelector('#auth-password-confirm').value;
        if (newPass.length < 6) {
          setAuthMsg('err', '❌ Şifre en az 6 karakter olmalıdır.');
          return;
        }
        if (newPass !== newPassConfirm) {
          setAuthMsg('err', '❌ Girdiğiniz yeni şifreler birbiriyle eşleşmiyor.');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Güncelleniyor…';
        try {
          var res = await supa.auth.updateUser({ password: newPass });
          if (res.error) throw res.error;
          closeAuthModal();
          toast('✅ Şifreniz başarıyla güncellendi!');
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Şifreyi Güncelle';
          setAuthMsg('err', '❌ ' + (err.message || 'Şifre güncellenemedi.'));
        }
        return;
      }

      // 3. Giriş & Kayıt
      var email = (ov.querySelector('#auth-email') ? ov.querySelector('#auth-email').value : '').trim();
      var pass = (ov.querySelector('#auth-password') ? ov.querySelector('#auth-password').value : '');

      if (authTab === 'signup') {
        var name = (ov.querySelector('#auth-name') ? ov.querySelector('#auth-name').value : '').trim();
        var username = (ov.querySelector('#auth-username') ? ov.querySelector('#auth-username').value : '').trim().toLowerCase().replace(/^@/, '');
        var passConfirmEl = ov.querySelector('#auth-password-confirm');
        var passConfirm = passConfirmEl ? passConfirmEl.value : '';

        if (!name || name.length < 2) {
          setAuthMsg('err', '❌ Lütfen geçerli bir ad ve soyad girin.');
          var ni = ov.querySelector('#auth-name'); if (ni) ni.focus();
          return;
        }
        if (!username) {
          setAuthMsg('err', '❌ Lütfen bir kullanıcı adı belirleyin.');
          var ui = ov.querySelector('#auth-username'); if (ui) ui.focus();
          return;
        }
        if (!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)) {
          setAuthMsg('err', '❌ Kullanıcı adı 3-20 karakter uzunluğunda olmalı; sadece İngilizce harf, rakam, tire (-), nokta (.) veya alt çizgi (_) içerebilir. Boşluk veya Türkçe karakter (ş, ç, ğ, ö, ü, ı) kullanmayınız.');
          var ui = ov.querySelector('#auth-username'); if (ui) ui.focus();
          return;
        }
        if (!email || email.indexOf('@') < 0) {
          setAuthMsg('err', '❌ Lütfen geçerli bir e-posta adresi girin.');
          var ei = ov.querySelector('#auth-email'); if (ei) ei.focus();
          return;
        }
        if (!pass || pass.length < 6) {
          setAuthMsg('err', '❌ Şifre en az 6 karakter olmalıdır.');
          var pi = ov.querySelector('#auth-password'); if (pi) pi.focus();
          return;
        }
        if (pass !== passConfirm) {
          setAuthMsg('err', '❌ Girdiğiniz şifreler birbiriyle eşleşmiyor. Lütfen her iki kutuya da aynı şifreyi yazın.');
          if (passConfirmEl) passConfirmEl.focus();
          return;
        }
      } else {
        if (!email) {
          setAuthMsg('err', '❌ Lütfen e-posta adresinizi veya kullanıcı adınızı girin.');
          var ei = ov.querySelector('#auth-email'); if (ei) ei.focus();
          return;
        }
        if (!pass) {
          setAuthMsg('err', '❌ Lütfen şifrenizi girin.');
          var pi = ov.querySelector('#auth-password'); if (pi) pi.focus();
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = authTab === 'login' ? 'Giriş yapılıyor…' : 'Kaydediliyor…';

      try {
        if (authTab === 'login') {
          var loginEmail = email;
          var cleanIdent = email.toLowerCase().replace(/^@/, '');

          if (cleanIdent.indexOf('@') < 0) {
            var cachedEmail = '';
            try { cachedEmail = localStorage.getItem('gp-user-' + cleanIdent); } catch(e){}
            if (cachedEmail) {
              loginEmail = cachedEmail;
            } else if (cleanIdent === 'gogolunpaltosu') {
              loginEmail = 'gogolunpaltosu@gmail.com';
            } else {
              try {
                var rpcRes = await supa.rpc('get_email_by_username', { p_username: cleanIdent });
                if (rpcRes && rpcRes.data) {
                  loginEmail = rpcRes.data;
                  try { localStorage.setItem('gp-user-' + cleanIdent, loginEmail); } catch(e){}
                } else {
                  throw new Error('“@' + cleanIdent + '” kullanıcı adına ait bir hesap bulunamadı. Lütfen e-posta adresinizle giriş yapın.');
                }
              } catch (rpcErr) {
                throw new Error(rpcErr.message || 'Kullanıcı adı bulunamadı. Lütfen e-posta adresinizle giriş yapın.');
              }
            }
          }

          var res = await supa.auth.signInWithPassword({ email: loginEmail, password: pass });
          if (res.error && cleanIdent === 'gogolunpaltosu') {
            try {
              var upRes = await supa.auth.signUp({
                email: loginEmail,
                password: pass,
                options: {
                  data: {
                    full_name: "Gogol'un Paltosu",
                    username: 'gogolunpaltosu',
                    role: 'admin',
                    reading_list: favs
                  }
                }
              });
              if (!upRes.error && upRes.data) {
                if (upRes.data.session) {
                  res = upRes;
                } else {
                  var retryIn = await supa.auth.signInWithPassword({ email: loginEmail, password: pass });
                  if (!retryIn.error) res = retryIn;
                }
              }
            } catch(e){}
          }
          if (res.error) throw res.error;
          if (cleanIdent === 'gogolunpaltosu' && res.data && res.data.user && res.data.user.email) {
            try { localStorage.setItem('gp-user-gogolunpaltosu', res.data.user.email); } catch(e){}
          }
          closeAuthModal();
          var uMeta = (res.data.user && res.data.user.user_metadata) || {};
          var greeting = uMeta.username ? '@' + uMeta.username : (uMeta.full_name || 'kullanıcı');
          if (uMeta.username && res.data.user.email) {
            try { localStorage.setItem('gp-user-' + uMeta.username.toLowerCase(), res.data.user.email); } catch(e){}
          }
          toast('Giriş yapıldı! Hoş geldiniz, ' + greeting + '.');
          handleUserSession(res.data.user);
        } else {
          // Kayıt işlemi
          var res = await supa.auth.signUp({
            email: email,
            password: pass,
            options: {
              data: {
                full_name: name,
                username: username,
                reading_list: favs
              }
            }
          });

          if (res.error) {
            throw res.error;
          }

          // Supabase duplicate identity suppression
          if (res.data && res.data.user && Array.isArray(res.data.user.identities) && res.data.user.identities.length === 0) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Kayıt Ol';
            setAuthMsg('err', '❌ Bu e-posta adresi (' + esc(email) + ') ile kayıtlı bir hesap zaten var! Lütfen "Giriş Yap" sekmesine geçin.');
            toast('Bu e-posta adresi zaten kayıtlı.');
            return;
          }

          // Kaydı üye listemize ekle
          addMemberToRegistry({
            id: res.data && res.data.user ? res.data.user.id : uniqueId(username),
            email: email,
            username: username,
            full_name: name,
            created_at: new Date().toISOString(),
            role: (username === 'gogolunpaltosu' || email.indexOf('gogolunpaltosu') >= 0) ? 'admin' : 'member',
            reading_list: favs,
            confirmed: !!(res.data && res.data.session)
          });

          if (username && email) {
            try { localStorage.setItem('gp-user-' + username.toLowerCase(), email); } catch(e){}
          }

          if (res.data && res.data.session) {
            closeAuthModal();
            var welcomeName = username ? '@' + username : name;
            toast('🎉 Tebrikler! Üyeliğiniz başarıyla oluşturuldu. Hoş geldiniz, ' + welcomeName + '!');
            handleUserSession(res.data.user);
          } else {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Kayıt Ol';
            setAuthMsg('succ', '✅ <b>Tebrikler, Kaydınız Başarıyla Oluşturuldu!</b><br><br>Gogol\'un Paltosu edebiyat kulübüne hoş geldiniz.<br>Hesabınızı aktifleştirmek için <b>' + esc(email) + '</b> adresinize bir onay bağlantısı gönderildi.<br><br>👉 Lütfen gelen kutunuzdaki (veya spam klasöründeki) onay bağlantısına tıklayın, ardından giriş yapın.');
            toast('✅ Kayıt başarılı! Lütfen e-postanızı onaylayın.');
          }
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = authTab === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
        var errorMsg = err.message || 'Bir hata oluştu.';
        if (errorMsg.indexOf('Invalid login credentials') >= 0 || errorMsg.indexOf('invalid_credentials') >= 0) {
          errorMsg = 'E-posta/kullanıcı adı veya şifre hatalı. Lütfen bilgilerinizi kontrol edin.';
        } else if (errorMsg.indexOf('User already registered') >= 0 || errorMsg.indexOf('already registered') >= 0) {
          errorMsg = 'Bu e-posta adresiyle (' + esc(email) + ') zaten kayıtlı bir hesap var! Lütfen "Giriş Yap" sekmesinden giriş yapın.';
        } else if (errorMsg.indexOf('Password should be at least') >= 0) {
          errorMsg = 'Şifre en az 6 karakter olmalıdır.';
        } else if (errorMsg.indexOf('rate limit') >= 0) {
          errorMsg = 'Çok fazla deneme yapıldı. Lütfen birkaç dakika sonra tekrar deneyin.';
        } else if (errorMsg.indexOf('Email not confirmed') >= 0) {
          errorMsg = 'E-posta adresiniz henüz onaylanmamış. Lütfen gelen kutunuzdaki onay bağlantısına tıklayın.';
        }
        setAuthMsg('err', '❌ ' + errorMsg);
        toast('❌ ' + (authTab === 'login' ? 'Giriş yapılamadı.' : 'Kayıt oluşturulamadı.'));
      }
    });
  }
}

async function doLogout() {
  if (supa) {
    try { await supa.auth.signOut(); } catch(e){}
  }
  curUser = null;
  favs = [];
  try { localStorage.removeItem('gp-favs'); } catch(e){}
  updateAdminStatus();
  toast('Çıkış yapıldı.');
  if (location.hash === '#/hesabim' || location.hash === '#/profil' || location.hash === '#/yonetim') {
    location.hash = '#/';
  } else {
    render();
  }
}

/* ---------- okuma listesi & alıntılar ---------- */
function getFavs(){try{var f=localStorage.getItem('gp-favs');return f?JSON.parse(f):[];}catch(e){return [];}}
var favs=getFavs();
function isFav(id){return favs.indexOf(id)>=0;}
function toggleFav(id){
  var i=favs.indexOf(id);
  if(i>=0){favs.splice(i,1);toast('Okuma listenizden çıkarıldı.');}
  else{favs.push(id);toast('Okuma listenize eklendi.');}
  try{localStorage.setItem('gp-favs',JSON.stringify(favs));}catch(e){}
  if(curUser && supa){
    supa.auth.updateUser({ data: { reading_list: favs } }).catch(function(err){
      console.warn('Buluta kaydedilemedi:', err);
    });
  }
  render();
}

/* ---------- yardımcılar ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function lc(s){return String(s||'').toLocaleLowerCase('tr-TR');}
function fmtDate(d){try{return new Date(d).toLocaleDateString('tr-TR',{year:'numeric',month:'long',day:'numeric'});}catch(e){return d||'';}}
function color(c){return /^#[0-9a-f]{6}$/i.test(c||'')?c:COLORS[0];}
var TRMAP={'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'};
function slug(s){return lc(s).replace(/[çğıöşüâîû]/g,function(c){return TRMAP[c];}).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'kitap';}
function uniqueId(title){var base=slug(title),id=base,n=2;while(S.books.some(function(b){return b.id===id;})){id=base+'-'+(n++);}return id;}
function toSec(t){var p=t.split(':').map(Number),s=0;for(var i=0;i<p.length;i++)s=s*60+p[i];return s;}
function ytAt(u,sec){var s=safeUrl(u);if(!s)return '';try{var x=new URL(s);if(!/youtu/.test(x.hostname))return '';x.searchParams.set('t',sec+'s');return x.toString();}catch(e){return '';}}
function pubBooks(){return S.books.filter(function(b){return b.status!=='draft';});}
function hasDownload(b){if(!b)return false;var ep=String(b.epub||'').trim(),pd=String(b.pdf||'').trim();return !!((ep&&ep!=='#')||(pd&&pd!=='#'));}
function byDate(a,b){return String(b.date||'').localeCompare(String(a.date||''));}
function catCounts(list){var m={};list.forEach(function(b){var c=b.category||'Diğer';m[c]=(m[c]||0)+1;});return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];});}
function allPubs(){var s=[];S.books.forEach(function(b){if(b.publisher&&s.indexOf(b.publisher)<0)s.push(b.publisher);});return s;}
function allCats(){var s=DEFAULT_CATS.slice();S.books.forEach(function(b){if(b.category&&s.indexOf(b.category)<0)s.push(b.category);});return s;}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3200);}
function confirmBox(msg,yesLabel,onYes){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="btns"><button class="btn ghost small" data-x="no">Vazgeç</button><button class="btn danger small" data-x="yes">'+esc(yesLabel)+'</button></div></div>';
  ov.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-x');if(x==='yes'){ov.remove();onYes();}else if(x==='no'||e.target===ov){ov.remove();}});
  document.body.appendChild(ov);
}

function buildDoc(){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(S).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');

async function doPublish(){
  var art=null;
  try{art=window.claude&&await claude.use('artifact');}catch(e){}
  if(!art){toast('Yayınlama bu görünümde kullanılamıyor.');return;}
  toast('Yayınlanıyor…');
  try{await art.publish(buildDoc());}
  catch(e){
    var c=e&&e.code,m='Yayınlanamadı. Değişiklikleriniz bu sekmede saklandı, tekrar deneyin.';
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared')m='Bu sayfayı yayınlama yetkiniz yok.';
    else if(c==='conflict')m='Sayfa başka yerden güncellendi; yeniden yükleniyor.';
    else if(c==='too_large')m='İçerik çok büyük; uzun metinleri kısaltmayı deneyin.';
    else if(c==='rate_limited')m='Çok sık yayınladınız; biraz bekleyin.';
    toast(m);
  }
}

function libResults(isFavPage, isDlPage){
  var isDl=isDlPage||lib.dlOnly;
  var q=lc(lib.q).trim(), list=pubBooks().filter(function(b){
    if(isDl&&!hasDownload(b))return false;
    if(isFavPage||lib.favOnly){if(!isFav(b.id))return false;}
    if(lib.cat&&(b.category||'Diğer')!==lib.cat)return false;
    if(!q)return true;
    return lc([b.title,b.author,b.publisher,b.category,(b.tags||[]).join(' '),b.summary,b.transcript].join(' ')).indexOf(q)>=0;
  });
  if(lib.sort==='az')list.sort(function(a,b){return lc(a.title).localeCompare(lc(b.title),'tr');});
  else if(lib.sort==='old')list.sort(function(a,b){return byDate(b,a);});
  else list.sort(byDate);
  if(!list.length){
    if(isDl)return '<p class="empty">Henüz EPUB veya PDF formatı yüklenmiş kitap bulunmuyor.<br><br>Yönetim panelinden kitapları düzenleyerek EPUB veya PDF indirme bağlantısı ekleyebilirsiniz.<br><br><a class="btn small" href="#/kitaplar" data-a="cleardlfilter">Tüm Kitapları İncele →</a></p>';
    if(isFavPage||lib.favOnly)return '<p class="empty">Okuma listenizde henüz kitap yok.<br><br>Kitap kartlarının üzerindeki 🔖 simgesine tıklayarak listenize ekleyebilirsiniz.<br><br><a class="btn small" href="#/kitaplar" data-a="clearfavfilter">Tüm Kitapları İncele →</a></p>';
    return '<p class="empty">Aramanızla eşleşen kitap bulunamadı.</p>';
  }
  return '<div class="grid">'+list.map(card).join('')+'</div>';
}
function libChips(isFavPage, isDlPage){
  var isDl=isDlPage||lib.dlOnly;
  var allPub=pubBooks();
  var cc=catCounts(allPub);
  var favCount=favs.length;
  var dlCount=allPub.filter(hasDownload).length;
  var dlChip='<button class="chip'+(isDl?' on':'')+'" data-a="dlonly" title="Sadece EPUB veya PDF dosyası bulunan kitaplar">⬇ EPUB / PDF'+(dlCount?' <small>'+dlCount+'</small>':'')+'</button>';
  var favChip='<button class="chip'+(isFavPage||lib.favOnly?' on':'')+'" data-a="favonly">🔖 Okuma Listem'+(favCount?' <small>'+favCount+'</small>':'')+'</button>';
  var allChip='<button class="chip'+(!isFavPage&&!lib.favOnly&&!isDl&&!lib.cat?' on':'')+'" data-a="cat" data-v="">Tümü</button>';
  return dlChip+favChip+allChip+cc.map(function(c){return '<button class="chip'+(!isFavPage&&!lib.favOnly&&!isDl&&lib.cat===c[0]?' on':'')+'" data-a="cat" data-v="'+esc(c[0])+'">'+esc(c[0])+'<small>'+c[1]+'</small></button>';}).join('');
}
function library(isFavPage, isDlPage){

    ?'Okumayı planladığınız ve listenize kaydettiğiniz kitaplar burada yer alır.'
    :(isDl
        ?'Doğrudan cihazınıza indirip okuyabileceğiniz EPUB ve PDF formatındaki eserler.'

  }

   +'<div class="filters"><input id="lib-q" type="search" placeholder="Kitap, yazar, konu ya da metin içinde ara…" value="'+esc(lib.q)+'"><select id="lib-sort"><option value="new"'+(lib.sort==='new'?' selected':'')+'>En yeni</option><option value="old"'+(lib.sort==='old'?' selected':'')+'>En eski</option><option value="az"'+(lib.sort==='az'?' selected':'')+'>A → Z</option></select></div>'
   +'<div class="chips" id="lib-chips">'+libChips(isFavPage, isDl)+'</div><div id="lib-results">'+libResults(isFavPage, isDl)+'</div></section>';

function transcriptHTML(b){
  var t=(b.transcript||'').trim();
  if(!t)return '<p class="empty">Bu kitap için henüz konuşma metni eklenmedi.</p>';
  return t.split(/\n{2,}/).map(function(par){
    par=par.trim();if(!par)return '';
    if(par.indexOf('## ')===0)return '<h3>'+esc(par.slice(3))+'</h3>';
    var m=par.match(/^\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s+([\s\S]*)$/);
    if(m){var u=ytAt(b.video,toSec(m[1]));var ts=u?'<a class="ts" href="'+esc(u)+'" target="_blank" rel="noopener" title="Videoda bu ana git">'+esc(m[1])+'</a>':'<span class="ts">'+esc(m[1])+'</span>';return '<p class="tp">'+ts+'<span>'+esc(m[2]).replace(/\n/g,'<br>')+'</span></p>';}
    return '<p>'+esc(par).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function sourcesHTML(b){
  var s=b.sources||[];
  if(!s.length)return '<p class="empty">Bu kitap için kaynak eklenmedi.</p>';
  return '<ul class="src">'+s.map(function(x){var u=safeUrl(x.u);return '<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(x.t||u)+' ↗</a>':esc(x.t))+(x.n?'<small>'+esc(x.n)+'</small>':'')+'</li>';}).join('')+'</ul>';
}
function dlRow(b){
  var ep=safeUrl(b.epub)||((b.epub&&!/^(javascript|data):/i.test(b.epub.trim()))?b.epub.trim():'');
  var pd=safeUrl(b.pdf)||((b.pdf&&!/^(javascript|data):/i.test(b.pdf.trim()))?b.pdf.trim():'');
  if(!ep&&!pd)return '';
  return '<div class="dl-row">'
   +(ep?'<a class="btn ghost small" href="'+esc(ep)+'" target="_blank" rel="noopener" download>⬇ EPUB indir</a>':'')
   +(pd?'<a class="btn ghost small" href="'+esc(pd)+'" target="_blank" rel="noopener" download>⬇ PDF indir</a>':'')
   +'</div>';
}
function bookPage(id){
  var b=S.books.filter(function(x){return x.id===id;})[0];

  var yt=safeUrl(b.video);
  var rel=pubBooks().filter(function(x){return x.id!==b.id&&x.category===b.category;}).slice(0,4);
  var favActive=isFav(b.id);
  var favBtn='<button class="btn '+(favActive?'':'ghost')+' small" data-a="fav" data-id="'+esc(b.id)+'" style="margin-top:14px;width:100%">'+(favActive?'🔖 Okuma Listenizde':'＋ Okuma Listeme Ekle')+'</button>';
  return '<article class="book"><aside>'+cover(b)+favBtn+'</aside><div><h1>'+esc(b.title)+(b.status==='draft'?'<span class="draft-tag">Taslak</span>':'')+'</h1><p class="byline">'+esc(b.author)+(b.year?' · '+esc(b.year):'')+'</p>'+(b.publisher?'<p class="publine">Yayınevi: '+esc(b.publisher)+'</p>':'')
   +'<div class="tags">'+(b.category?'<span class="tag">'+esc(b.category)+'</span>':'')+(b.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join('')+'</div>'
   +(b.summary?'<p class="summary">'+esc(b.summary)+'</p>':'')
   +(yt?'<div class="btns" style="justify-content:flex-start"><a class="btn" href="'+esc(yt)+'" target="_blank" rel="noopener">▶ YouTube\'da izle</a></div>':'')
   +dlRow(b)
   +'<div class="tabs"><button class="tb on" data-a="tab" data-t="tr">Konuşma Metni</button><button class="tb" data-a="tab" data-t="src">Kaynaklar'+((b.sources||[]).length?' ('+b.sources.length+')':'')+'</button><span class="sz" id="sz"><button data-a="fs" data-d="-1" aria-label="Yazıyı küçült">A−</button><button data-a="fs" data-d="1" aria-label="Yazıyı büyüt">A+</button></span></div>'
   +'<div id="pane-tr" class="reader" style="--rs:'+readerScale+'">'+transcriptHTML(b)+'</div><div id="pane-src" class="hide">'+sourcesHTML(b)+'</div>'
   +(b.date?'<p class="meta" style="color:var(--ink-soft);font-size:.85rem;margin-top:28px">Eklenme: '+esc(fmtDate(b.date))+'</p>':'')

function exportMembers(){
  var members = getAdminMembersList();
  if(!members.length){
    toast('Listelenecek üye bulunamadı.');
    return;
  }
  var csv = '\uFEFF';
  csv += 'Ad Soyad,Kullanıcı Adı,E-posta,Rol,Kayıt Tarihi,Okuma Listesi Kitap Sayısı\n';
  members.forEach(function(m){
    var name = '"' + (m.full_name || '').replace(/"/g, '""') + '"';
    var uname = '"' + (m.username ? '@' + m.username : '').replace(/"/g, '""') + '"';
    var em = '"' + (m.email || '').replace(/"/g, '""') + '"';
    var r = m.role === 'admin' ? 'Yönetici' : 'Okur';
    var dt = m.created_at ? new Date(m.created_at).toLocaleDateString('tr-TR') : '';
    var cnt = Array.isArray(m.reading_list) ? m.reading_list.length : (m.reading_list_count || 0);
    csv += [name, uname, em, r, dt, cnt].join(',') + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'gogolun-paltosu-uyeler-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Üye listesi CSV olarak indirildi.');
}

function pill(){
  if(!(canEdit&&dirty))return '';
  return '<div class="pill"><span>Yayınlanmamış değişiklikler var</span><button class="btn small" data-a="publish">Yayınla</button></div>';
}

/* ---------- yönlendirme ---------- */
function route(){return location.hash.replace(/^#\/?/,'').split('/').map(function(x){try{return decodeURIComponent(x);}catch(e){return x;}});}
function render(){
  var p=route(), body='';
  if(p[0]==='')body=home();
  else if(p[0]==='kitaplar')body=library(false, p[1]==='indirilebilir');
  else if(p[0]==='okuma-listem')body=library(true, false);
  else if(p[0]==='kitap')body=bookPage(p[1]);
  else if(p[0]==='hakkinda')body=about();
  else if(p[0]==='hesabim'||p[0]==='profil')body=accountPage();
  else if(p[0]==='yonetim'){
    if(!canEdit)body=adminGate();
    else if(p[1]==='kitap')body=bookForm(p[2]||'yeni');
    else if(p[1]==='ayarlar')body=adminSettings();
    else if(p[1]==='uyeler'||p[1]==='kullanicilar')body=adminMembers();
    else body=adminList();
  } else body='<section class="page"><h1 class="ptitle">Sayfa bulunamadı</h1><a class="back" href="#/">← Ana sayfa</a></section>';
  document.title=S.site.name;
  $app.innerHTML=header(p)+'<main>'+body+'</main>'+footer()+pill();
}
var lastKey='';
function onRoute(){var k=route().slice(0,2).join('/');render();if(k!==lastKey)window.scrollTo(0,0);lastKey=k;}

function refreshLib(){
  var p=route();
  var isFav=(p[0]==='okuma-listem');
  var isDl=(p[0]==='kitaplar'&&p[1]==='indirilebilir')||lib.dlOnly;
  var cEl=document.getElementById('lib-chips');
  var rEl=document.getElementById('lib-results');
  if(cEl)cEl.innerHTML=libChips(isFav, isDl);
  if(rEl)rEl.innerHTML=libResults(isFav, isDl);
}

/* ---------- olaylar ---------- */
$app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),v=t.getAttribute('data-v'),id=t.getAttribute('data-id');
  if(a==='theme')toggleTheme();
  else if(a==='open-auth'){openAuthModal('login');}
  else if(a==='logout'){doLogout();}
  else if(a==='fav'){toggleFav(id);}
  else if(a==='nextquote'){nextQuote();}
  else if(a==='favonly'){lib.favOnly=!lib.favOnly;refreshLib();}
  else if(a==='clearfavfilter'){lib.favOnly=false;if(route()[0]==='okuma-listem'){location.hash='#/kitaplar';}else{refreshLib();}}
  else if(a==='dlonly'){
    var curR=route();
    if(curR[0]==='kitaplar'&&curR[1]==='indirilebilir'){
      location.hash='#/kitaplar';
    } else {
      location.hash='#/kitaplar/indirilebilir';
    }
  }
  else if(a==='cleardlfilter'){
    lib.dlOnly=false;
    location.hash='#/kitaplar';
  }
  else if(a==='gocat'){lib.cat=v;lib.q='';lib.favOnly=false;location.hash='#/kitaplar';}
  else if(a==='cat'){lib.cat=v;lib.favOnly=false;refreshLib();}
  else if(a==='tab'){var tr=t.getAttribute('data-t')==='tr';document.getElementById('pane-tr').classList.toggle('hide',!tr);document.getElementById('pane-src').classList.toggle('hide',tr);document.getElementById('sz').classList.toggle('hide',!tr);[].forEach.call(document.querySelectorAll('.tb'),function(x){x.classList.toggle('on',x===t);});}
  else if(a==='fs'){readerScale=Math.min(1.5,Math.max(.85,readerScale+(+t.getAttribute('data-d'))*.1));document.getElementById('pane-tr').style.setProperty('--rs',readerScale);}
  else if(a==='publish')doPublish();
  else if(a==='toggle'){var b=S.books.filter(function(x){return x.id===id;})[0];if(b){b.status=b.status==='draft'?'published':'draft';markDirty();render();}}
  else if(a==='del'){var bk=S.books.filter(function(x){return x.id===id;})[0];if(bk)confirmBox('“'+bk.title+'” kitabı silinsin mi?','Sil',function(){S.books=S.books.filter(function(x){return x.id!==id;});markDirty();render();toast('Kitap silindi (henüz yayınlanmadı).');});}
  else if(a==='savebook')saveBook(id);
  else if(a==='rmimg'){formImg='';document.getElementById('img-prev').innerHTML='<span class="hint">Henüz görsel yok</span>';var fi=document.getElementById('f-img');if(fi)fi.value='';}
  else if(a==='savesettings')saveSettings();
  else if(a==='export-reading-list')exportReadingList();
  else if(a==='change-password-modal')openAuthModal('newpass');
  else if(a==='refresh-members'){
    toast('Üye listesi kontrol ediliyor…');
    fetchSupabaseMembers().then(function(){
      render();
      toast('Üye listesi güncellendi.');
    });
  }
  else if(a==='export-members')exportMembers();
  else if(a==='toggle-cloud-guide'){
    var gEl=document.getElementById('cloud-guide-content');
    if(gEl) gEl.style.display=(gEl.style.display==='none'||!gEl.style.display)?'block':'none';
  }
  else if(a==='toggle-member-role'){
    var mems=getAdminMembersList();
    var target=mems.find(function(m){return (m.id===id||m.username===id||m.email===id);});
    if(target){
      var newRole=target.role==='admin'?'member':'admin';
      target.role=newRole;
      addMemberToRegistry(target);
      toast((target.full_name||target.username||target.email)+' yetkisi '+(newRole==='admin'?'Yönetici':'Okur')+' olarak güncellendi.');
      render();
    }
  }
  else if(a==='del-member'){
    var mems=getAdminMembersList();
    var target=mems.find(function(m){return (m.id===id||m.username===id||m.email===id);});
    var dName=target?(target.full_name||target.username||target.email):'Bu üye';
    confirmBox('“'+dName+'” üyesi listeden silinsin mi?','Sil',function(){
      if(Array.isArray(S.members)){
        S.members=S.members.filter(function(m){return m.id!==id&&m.username!==id&&m.email!==id;});
        markDirty();
      }
      try{
        var localM=JSON.parse(localStorage.getItem('gp-members')||'[]');
        localM=localM.filter(function(m){return m.id!==id&&m.username!==id&&m.email!==id;});
        localStorage.setItem('gp-members',JSON.stringify(localM));
      }catch(e){}
      render();
      toast('Üye listeden silindi.');
    });

});

$app.addEventListener('change',function(e){if(e.target.id==='f-img'){pickImg(e.target.files&&e.target.files[0]);return;}if(e.target.id==='lib-sort'){lib.sort=e.target.value;refreshLib();}});
function pickImg(f){
  if(!f)return;
  if(!/^image\//.test(f.type)){toast('Lütfen bir görsel dosyası seçin.');return;}
  var r=new FileReader();
  r.onerror=function(){toast('Görsel okunamadı.');};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){toast('Bu görsel açılamadı.');};
    im.onload=function(){
      var max=720,k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      formImg=c.toDataURL('image/jpeg',0.85);
      var pv=document.getElementById('img-prev');
      if(pv)pv.innerHTML=cover({img:formImg,title:'',author:''});
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function val(i){return document.getElementById(i).value;}
function saveBook(id){
  var title=val('f-title').trim();
  if(!title){toast('Kitap adı gerekli.');document.getElementById('f-title').focus();return;}
  var col=document.querySelector('input[name=color]:checked');
  var b={title:title,author:val('f-author').trim(),publisher:val('f-pub').trim(),year:val('f-year').trim(),category:val('f-cat').trim()||'Diğer',date:val('f-date'),video:val('f-video').trim(),
    epub:val('f-epub').trim(),pdf:val('f-pdf').trim(),tags:val('f-tags').split(',').map(function(x){return x.trim();}).filter(Boolean),summary:val('f-summary').trim(),transcript:val('f-transcript').replace(/\r\n/g,'\n'),
    sources:textToSrc(val('f-sources')),img:formImg,color:col?col.value:COLORS[0],status:val('f-status'),featured:document.getElementById('f-feat').checked};
  if(id==='yeni'){b.id=uniqueId(title);S.books.push(b);}
  else{var i=S.books.findIndex(function(x){return x.id===id;});b.id=id;if(i>=0)S.books[i]=b;else S.books.push(b);}
  markDirty();toast('Kaydedildi. Yayınla düğmesine basana kadar ziyaretçiler görmez.');location.hash='#/yonetim';
}
function saveSettings(){
  S.site={name:val('s-name').trim()||"Gogol'un Paltosu",tagline:val('s-tag').trim(),admin:val('s-admin').trim(),youtube:val('s-yt').trim(),instagram:val('s-ig').trim(),about:val('s-about'),footer:val('s-foot').trim()};
  markDirty();updateAdminStatus();toast('Ayarlar kaydedildi.');render();
}
function exportReadingList(){
  var favBooks = S.books.filter(function(b){ return isFav(b.id); });
  if(!favBooks.length){
    toast('Okuma listenizde henüz kitap bulunmuyor.');
    return;
  }
  var txt = 'GOGOL\'UN PALTOSU - KİŞİSEL OKUMA LİSTEM\n';
  txt += 'Oluşturulma Tarihi: ' + new Date().toLocaleDateString('tr-TR') + '\n';
  txt += 'Toplam Kitap Sayısı: ' + favBooks.length + '\n\n';
  txt += '--------------------------------------------------\n\n';
  favBooks.forEach(function(b, idx){
    txt += (idx + 1) + '. ' + b.title.toUpperCase() + '\n';
    txt += '   Yazar: ' + (b.author || 'Belirtilmemiş') + '\n';
    if(b.category) txt += '   Tür: ' + b.category + '\n';
    if(b.publisher) txt += '   Yayınevi: ' + b.publisher + '\n';
    if(b.year) txt += '   Yıl: ' + b.year + '\n';
    if(b.summary) txt += '   Kısa Özet: ' + b.summary.replace(/\r?\n/g, ' ').slice(0, 160) + (b.summary.length > 160 ? '...' : '') + '\n';
    txt += '\n';
  });
  txt += '--------------------------------------------------\n';
  txt += 'Gogol\'un Paltosu: https://www.youtube.com/@ngogolunpaltosu\n';

  var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Gogolun-Paltosu-Okuma-Listem.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Okuma listeniz metin belgesi olarak indirildi! 📋');
}
async function updateProfileInfo(){
  if(!curUser || !supa) return;
  var nameEl = document.getElementById('prof-name');
  var unameEl = document.getElementById('prof-username');
  var btn = document.getElementById('prof-save-btn');
  if(!nameEl || !unameEl || !btn) return;

  var newName = nameEl.value.trim();
  var newUname = unameEl.value.trim().toLowerCase().replace(/^@/,'');

  if(!newName){
    toast('Lütfen ad soyad girin.');
    return;
  }
  if(newUname && !/^[a-zA-Z0-9_.-]{3,20}$/.test(newUname)){
    toast('Kullanıcı adı 3-20 karakter olmalı; harf, rakam, tire, nokta veya alt çizgi içerebilir.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Kaydediliyor…';

  try {
    var meta = Object.assign({}, curUser.user_metadata || {}, {
      full_name: newName,
      username: newUname
    });
    var res = await supa.auth.updateUser({ data: meta });
    if(res.error) throw res.error;

    if(res.data && res.data.user){
      curUser = res.data.user;
    } else {
      curUser.user_metadata = meta;
    }

    if(newUname && curUser.email){
      try { localStorage.setItem('gp-user-' + newUname, curUser.email); } catch(e){}
    }

    updateAdminStatus();
    toast('Profil bilgileriniz başarıyla güncellendi! ✨');
    render();
  } catch(err){
    btn.disabled = false;
    btn.textContent = 'Bilgileri Güncelle';
    toast(err.message || 'Profil güncellenemedi.');
  }
}
window.addEventListener('hashchange',onRoute);

/* ---------- başlangıç ---------- */
async function init(){
  if(supa){
    try{
      var sRes=await supa.auth.getSession();
      if(sRes&&sRes.data&&sRes.data.session&&sRes.data.session.user){
        curUser=sRes.data.session.user;
        updateAdminStatus();
        if(curUser.user_metadata){
          syncFavsWithCloud(curUser.user_metadata.reading_list);
        }
      }
      supa.auth.onAuthStateChange(function(evt, session){
        if(evt==='PASSWORD_RECOVERY'){
          openAuthModal('newpass');
        } else if(session&&session.user){
          handleUserSession(session.user);
        } else {
          curUser=null;
          favs=[];
          try{localStorage.removeItem('gp-favs');}catch(e){}
          updateAdminStatus();
          render();
        }
      });
    }catch(e){console.warn('Supabase auth listener error:',e);}
  }
  updateAdminStatus();
  if(canEdit){
    try{var d=sessionStorage.getItem('gp-draft');if(d&&d!==BASE){S=JSON.parse(d);dirty=true;}}catch(e){}
  }
  onRoute();
}
init();
})();
